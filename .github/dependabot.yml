version: 2
updates:
  # Config lives on default `main` and on `pedro3`. PRs target `pedro3`, the
  # Allsparks working branch. Workflows pin actions to SHAs with a "# vX.Y.Z"
  # comment; Dependabot still opens PRs that move those pins.
  - package-ecosystem: github-actions
    directory: /
    target-branch: pedro3
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /
    target-branch: pedro3
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # JUnit 6 needs Java 17; Hub libraries still compile tests for Java 8 bytecode.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "junit:junit"
        update-types: ["version-update:semver-major"]
